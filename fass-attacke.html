<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fass-Attacke</title>
    <link rel="icon" type="image/png" href="images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            background: radial-gradient(circle at 50% 30%, #2a2a3a, #0c0c12);
            font-family: 'Press Start 2P', monospace;
            color: #fcfcfc;
        }

        .screen {
            position: relative;
            width: min(100%, 768px);
            aspect-ratio: 256 / 240;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 0 6px #222, 0 0 0 8px #444, 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* CRT-Look: Scanlines und Vignette */
        .screen::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.45));
        }

        .hint {
            font-size: 10px;
            line-height: 1.8;
            color: #9a9ab0;
            text-align: center;
        }

        .pad {
            display: none;
            width: min(100%, 768px);
            justify-content: space-between;
            align-items: center;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 56px);
        }

        .pad button {
            font-family: inherit;
            font-size: 18px;
            color: #fcfcfc;
            background: #333;
            border: none;
            border-radius: 10px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .pad button:active {
            background: #555;
        }

        .dpad .up { grid-area: 1 / 2; }
        .dpad .left { grid-area: 2 / 1; }
        .dpad .right { grid-area: 2 / 3; }
        .dpad .down { grid-area: 3 / 2; }

        .pad .jump {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #d82800;
        }

        .pad .jump:active {
            background: #f83800;
        }

        @media (hover: none) and (pointer: coarse) {
            .pad { display: flex; }
            .hint { display: none; }
        }
    </style>
</head>

<body>
    <div class="screen">
        <canvas id="screen" width="256" height="240"></canvas>
    </div>
    <p class="hint">← → laufen · ↑ ↓ Leiter · Leertaste springen · Enter starten</p>
    <div class="pad">
        <div class="dpad">
            <button type="button" class="up" data-k="up">▲</button>
            <button type="button" class="left" data-k="left">◀</button>
            <button type="button" class="right" data-k="right">▶</button>
            <button type="button" class="down" data-k="down">▼</button>
        </div>
        <button type="button" class="jump" data-k="jump">A</button>
    </div>

    <script>
        const W = 256, H = 240;
        const cv = document.getElementById('screen');
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        const FONT = '"Press Start 2P", monospace';

        // ---------- NES-Palette und Pixel-Sprites ----------
        const PAL = {
            Y: '#f8b800', S: '#fca044', K: '#000000', O: '#e45c10', B: '#0058f8',
            N: '#7c3c00', H: '#7c3c00', W: '#fcfcfc', P: '#f878f8', D: '#d800cc', R: '#d82800'
        };

        function sprite(rows) {
            const c = document.createElement('canvas');
            c.width = rows[0].length;
            c.height = rows.length;
            const g = c.getContext('2d');
            rows.forEach((row, y) => [...row].forEach((ch, x) => {
                if (ch !== '.') {
                    g.fillStyle = PAL[ch];
                    g.fillRect(x, y, 1, 1);
                }
            }));
            return c;
        }

        const heroTop = [
            '....YYYY....',
            '...YYYYYY...',
            '..YYYYYYYYY.',
            '...SSSSSS...',
            '...SSKSSK...',
            '...SSSSSS...',
            '....SSSS....',
            '..OOBOOBOO..',
            '.OOOBBBBOOO.',
            '.SS.BBBB.SS.',
            '....BBBB....'
        ];
        const heroStand = sprite([...heroTop,
            '...BBBBBB...',
            '...BB..BB...',
            '...BB..BB...',
            '..NNN..NNN..',
            '..NNN..NNN..'
        ]);
        const heroWalk = sprite([...heroTop,
            '...BBBBBB...',
            '..BB....BB..',
            '.BB......BB.',
            'NNN......NNN',
            'NN........NN'
        ]);
        const heroJump = sprite([
            '....YYYY....',
            '...YYYYYY...',
            '..YYYYYYYYY.',
            'S..SSSSSS..S',
            'S..SSKSSK..S',
            'OO.SSSSSS.OO',
            '.OO.SSSS.OO.',
            '..OOBOOBOO..',
            '...OBBBBO...',
            '....BBBB....',
            '....BBBB....',
            '...BBBBBB...',
            '..BB....BB..',
            '.BB......BB.',
            'NNN......NNN',
            '............'
        ]);
        const heroClimb = sprite([
            '....YYYY....',
            '...YYYYYY...',
            '..YYYYYYYYY.',
            '...HHHHHH...',
            'SS.HHHHHH...',
            '.SO.HHHH....',
            '..OOOOOOOO.S',
            '..OOBOOBOOOS',
            '...OBBBBOO..',
            '....BBBB....',
            '....BBBB....',
            '...BBBBBB...',
            '...BB..BB...',
            '...BB...BB..',
            '..NNN...NNN.',
            '........NNN.'
        ]);
        const princessTop = [
            '....YYYY....',
            '...YYYYYY...',
            '..YYSSSSYY..',
            '..YSKSSKSY..',
            '..YSSSSSSY..',
            '..YYSRRSYY..'
        ];
        const princessBottom = [
            '...PPPPPP...',
            '...PPPPPP...',
            '..PPPPPPPP..',
            '..PDPPPPDP..',
            '.PPPPPPPPPP.',
            '.PDPPPPPPDP.',
            'PPPPPPPPPPPP',
            '...NN..NN...'
        ];
        const princess = sprite([...princessTop,
            '.YY.SSSS.YY.',
            '....PPPP....',
            '..SPPWWPPS..',
            '..S.PPPP.S..',
            ...princessBottom]);
        const princessWave = sprite([...princessTop,
            '.YY.SSSS.YYS',
            '....PPPP..S.',
            '..SPPWWPP...',
            '..S.PPPP....',
            ...princessBottom]);
        const heart = sprite([
            '.RR.RR.',
            'RRRRRRR',
            'RRRRRRR',
            '.RRRRR.',
            '..RRR..',
            '...R...'
        ]);

        // ---------- Level: schräge Träger und Leitern ----------
        const girders = [
            { x0: 0, x1: 256, y0: 228, y1: 228 },
            { x0: 16, x1: 232, y0: 196, y1: 204 },
            { x0: 24, x1: 240, y0: 168, y1: 160 },
            { x0: 16, x1: 232, y0: 124, y1: 132 },
            { x0: 24, x1: 240, y0: 96, y1: 88 },
            { x0: 16, x1: 232, y0: 56, y1: 62 },
            { x0: 88, x1: 152, y0: 28, y1: 28 }
        ];
        const ladders = [
            { x: 184, b: 0, t: 1 },
            { x: 80, b: 1, t: 2 },
            { x: 200, b: 2, t: 3 },
            { x: 64, b: 3, t: 4 },
            { x: 168, b: 4, t: 5 },
            { x: 136, b: 5, t: 6 }
        ];

        function gy(i, x) {
            const g = girders[i];
            return g.y0 + (g.y1 - g.y0) * (x - g.x0) / (g.x1 - g.x0);
        }

        // Rollrichtung = bergab; ganz unten rollen Fässer nach links ins Ölfass
        function downhill(i) {
            if (i === 0) return -1;
            return Math.sign(girders[i].y1 - girders[i].y0);
        }

        // ---------- Spielzustand ----------
        const input = { left: false, right: false, up: false, down: false, jump: false, start: false };
        let mode = 'title', modeT = 0, tick = 0;
        let score = 0, lives = 3, round = 1, bonus = 5000, best = loadBest();
        let player = null, barrels = [], particles = [], popups = [];
        let ape = { pose: 'idle', poseT: 0, timer: 60 };
        let shake = 0, flash = 0, iris = null, drumLit = false;

        function loadBest() {
            try { return Number(localStorage.getItem('fassBest')) || 0; } catch (e) { return 0; }
        }
        function saveBest() {
            best = Math.max(best, score);
            try { localStorage.setItem('fassBest', best); } catch (e) { }
        }

        function barrelSpeed() {
            return Math.min(1.9, 0.9 + round * 0.15);
        }

        function startGame() {
            score = 0;
            lives = 3;
            round = 1;
            resetRound();
        }

        function resetRound() {
            player = { x: 40, y: 228, g: 0, state: 'ground', vx: 0, vy: 0, face: 1, anim: 0, sx: 1, sy: 1, ladder: null };
            barrels = [];
            popups = [];
            ape = { pose: 'idle', poseT: 0, timer: 60 };
            bonus = 5000;
            drumLit = false;
            iris = { t: 0 };
            mode = 'play';
            modeT = 0;
        }

        // ---------- Effekte ----------
        function burst(x, y, n, colors, o = {}) {
            for (let i = 0; i < n; i++) {
                const a = o.angle !== undefined ? o.angle + (Math.random() - 0.5) * (o.spread || 1) : Math.random() * Math.PI * 2;
                const s = (o.speed || 1) * (0.4 + Math.random() * 0.8);
                const life = (o.life || 30) * (0.6 + Math.random() * 0.6);
                particles.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    grav: o.grav || 0, life, max: life,
                    size: o.size || 1, color: colors[(Math.random() * colors.length) | 0]
                });
            }
        }

        const DUST = ['#bcbcbc', '#7c7c7c'];
        const FIRE = ['#f8b800', '#e45c10', '#d82800'];
        const SPARK = ['#f8b800', '#fcfcfc', '#fca044'];
        const CONFETTI = ['#f878f8', '#3cbcfc', '#f8b800', '#00a800', '#d82800', '#fcfcfc'];

        function addScore(points, x, y) {
            score += points;
            popups.push({ x, y, text: String(points), t: 0 });
        }

        function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
        function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

        // ---------- Update ----------
        function update() {
            tick++;
            modeT++;

            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.grav;
                p.life--;
            }
            particles = particles.filter(p => p.life > 0);
            for (const p of popups) p.t++;
            popups = popups.filter(p => p.t < 45);

            shake = shake > 0.3 ? shake * 0.85 : 0;
            if (flash > 0) flash--;
            if (iris && ++iris.t > 40) iris = null;

            if (drumLit && tick % 3 === 0) {
                burst(8 + Math.random() * 8, 211, 1, FIRE, { angle: -Math.PI / 2, spread: 0.6, speed: 0.6, life: 25 });
            }

            if (mode === 'title' || mode === 'over') {
                // Demo im Hintergrund: der Affe wirft weiter Fässer
                updateApe();
                updateBarrels();
                if (input.start) startGame();
            } else if (mode === 'play') {
                updatePlayer();
                updateApe();
                updateBarrels();
                checkHits();
                if (modeT % 120 === 0) {
                    bonus -= 100;
                    if (bonus <= 0) die();
                }
            } else if (mode === 'dying') {
                updateDying();
            } else if (mode === 'win') {
                updateWin();
            }

            input.jump = false;
            input.start = false;
        }

        function updatePlayer() {
            const p = player;
            const prevY = p.y;
            p.sx += (1 - p.sx) * 0.2;
            p.sy += (1 - p.sy) * 0.2;

            if (p.state === 'ground') {
                p.vx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
                if (p.vx) p.face = p.vx;
                p.x = Math.max(6, Math.min(250, p.x + p.vx));
                p.anim += Math.abs(p.vx) * 0.15;
                if (p.vx && tick % 12 === 0) burst(p.x - p.vx * 4, p.y, 1, DUST, { angle: -Math.PI / 2, speed: 0.3, life: 15 });

                const g = girders[p.g];
                if (p.x < g.x0 || p.x > g.x1) {
                    p.state = 'air';
                    p.vy = 0;
                } else {
                    p.y = gy(p.g, p.x);
                }

                if (p.state === 'ground') {
                    const up = input.up && ladders.find(l => l.b === p.g && Math.abs(p.x - l.x) < 4);
                    const down = input.down && ladders.find(l => l.t === p.g && Math.abs(p.x - l.x) < 4);
                    if (up || down) {
                        p.state = 'ladder';
                        p.ladder = up || down;
                        p.x = p.ladder.x;
                        if (down) p.y += 1;
                    } else if (input.jump) {
                        p.state = 'air';
                        p.vy = -2.5;
                        p.sx = 0.75;
                        p.sy = 1.3;
                        burst(p.x, p.y, 6, DUST, { angle: -Math.PI / 2, spread: 2.5, speed: 0.8, life: 20 });
                    }
                }
            } else if (p.state === 'air') {
                p.vy += 0.12;
                p.x = Math.max(6, Math.min(250, p.x + p.vx));
                p.y += p.vy;
                if (p.vy > 0) {
                    let land = -1;
                    girders.forEach((g, i) => {
                        if (p.x < g.x0 || p.x > g.x1) return;
                        const y = gy(i, p.x);
                        if (prevY <= y + 0.5 && p.y >= y && (land < 0 || y < gy(land, p.x))) land = i;
                    });
                    if (land >= 0) {
                        p.g = land;
                        p.y = gy(land, p.x);
                        p.state = 'ground';
                        p.sx = 1.35;
                        p.sy = 0.7;
                        burst(p.x, p.y, 8, DUST, { angle: -Math.PI / 2, spread: 3, speed: 0.9, life: 20 });
                    }
                }
                if (p.y > H + 20) die();
            } else if (p.state === 'ladder') {
                const l = p.ladder;
                const top = gy(l.t, l.x), bottom = gy(l.b, l.x);
                if (input.up) p.y -= 0.7;
                if (input.down) p.y += 0.7;
                if (p.y <= top) {
                    p.y = top;
                    p.g = l.t;
                    p.state = 'ground';
                } else if (p.y >= bottom) {
                    p.y = bottom;
                    p.g = l.b;
                    p.state = 'ground';
                }
            }

            if (p.state === 'ground' && p.g === 6) win();
        }

        function updateApe() {
            ape.poseT++;
            if (ape.pose === 'idle') {
                if (--ape.timer <= 0) {
                    ape.pose = 'grab';
                    ape.poseT = 0;
                }
            } else if (ape.pose === 'grab' && ape.poseT > 28) {
                ape.pose = 'throw';
                ape.poseT = 0;
                barrels.push({ x: 56, y: gy(5, 56), g: 5, state: 'roll', vx: barrelSpeed(), vy: 0, roll: 0, lastLadder: null, scored: false });
            } else if (ape.pose === 'throw' && ape.poseT > 16) {
                ape.pose = Math.random() < 0.25 ? 'pound' : 'idle';
                ape.poseT = 0;
                ape.timer = Math.max(50, 150 - round * 20) + ((Math.random() * 60) | 0);
            } else if (ape.pose === 'pound' && ape.poseT > 60) {
                ape.pose = 'idle';
                ape.poseT = 0;
            }
            if (ape.pose === 'pound' && ape.poseT % 15 === 0) shake = Math.max(shake, 1.5);
        }

        function updateBarrels() {
            const speed = barrelSpeed();
            for (const b of barrels) {
                const prevX = b.x, prevY = b.y;
                if (b.state === 'roll') {
                    b.x += b.vx;
                    b.roll += Math.abs(b.vx) * 0.25;
                    const g = girders[b.g];
                    if (b.g === 0 && b.x < 20) {
                        // Fass landet im Ölfass
                        b.dead = true;
                        drumLit = true;
                        burst(12, 212, 14, FIRE, { angle: -Math.PI / 2, spread: 1.5, speed: 1.6, life: 30 });
                    } else if (b.x < g.x0 || b.x > g.x1) {
                        b.state = 'fall';
                        b.vy = 0;
                    } else {
                        b.y = gy(b.g, b.x);
                        // Manchmal rollt ein Fass eine Leiter hinunter
                        for (const l of ladders) {
                            if (l.t === b.g && l !== b.lastLadder && (prevX - l.x) * (b.x - l.x) <= 0) {
                                b.lastLadder = l;
                                if (Math.random() < 0.3) {
                                    b.state = 'ladder';
                                    b.ladder = l;
                                    b.x = l.x;
                                }
                            }
                        }
                    }
                } else if (b.state === 'fall') {
                    b.vy += 0.15;
                    b.y += b.vy;
                    b.x += b.vx * 0.4;
                    let land = -1;
                    girders.forEach((g, i) => {
                        if (b.x < g.x0 || b.x > g.x1) return;
                        const y = gy(i, b.x);
                        if (prevY <= y && b.y >= y && (land < 0 || y < gy(land, b.x))) land = i;
                    });
                    if (land >= 0) {
                        b.g = land;
                        b.y = gy(land, b.x);
                        b.state = 'roll';
                        b.vx = downhill(land) * speed;
                        b.squash = 8;
                        burst(b.x, b.y, 5, DUST, { angle: -Math.PI / 2, spread: 3, speed: 0.7, life: 18 });
                        shake = Math.max(shake, 0.8);
                    }
                    if (b.y > H + 20) b.dead = true;
                } else if (b.state === 'ladder') {
                    b.y += speed * 0.9;
                    b.roll += 0.2;
                    const bottom = gy(b.ladder.b, b.x);
                    if (b.y >= bottom) {
                        b.y = bottom;
                        b.g = b.ladder.b;
                        b.state = 'roll';
                        b.vx = downhill(b.g) * speed;
                        b.squash = 8;
                    }
                }
                if (b.squash > 0) b.squash--;
            }
            barrels = barrels.filter(b => !b.dead);
        }

        function checkHits() {
            const p = player;
            for (const b of barrels) {
                const dx = b.x - p.x;
                const dy = (b.y - 5) - (p.y - 8);
                if (Math.abs(dx) < 8 && Math.abs(dy) < 11) {
                    die();
                    return;
                }
                // Punkte fürs Überspringen
                if (!b.scored && p.state === 'air' && b.state === 'roll' && Math.abs(dx) < 6 && b.y > p.y && b.y - p.y < 30) {
                    b.scored = true;
                    addScore(100, p.x, p.y - 20);
                    burst(p.x, p.y - 4, 10, SPARK, { speed: 1.2, life: 25 });
                }
            }
        }

        function die() {
            if (mode !== 'play') return;
            mode = 'dying';
            modeT = 0;
            shake = 4;
            flash = 6;
        }

        function updateDying() {
            if (modeT === 30) burst(player.x, player.y - 8, 16, SPARK, { speed: 1.5, life: 35 });
            if (modeT >= 130) {
                lives--;
                if (lives > 0) {
                    resetRound();
                } else {
                    saveBest();
                    mode = 'over';
                    modeT = 0;
                    player = null;
                }
            }
        }

        function win() {
            mode = 'win';
            modeT = 0;
            ape.pose = 'pound';
            ape.poseT = 0;
            burst(player.x + 6, player.y - 24, 30, CONFETTI, { speed: 1.6, grav: 0.04, life: 70 });
        }

        function updateWin() {
            ape.poseT++;
            if (ape.poseT % 15 === 0) shake = Math.max(shake, 1.2);
            if (modeT % 8 === 0 && modeT < 80) {
                burst(40 + Math.random() * 176, 0, 6, CONFETTI, { angle: Math.PI / 2, spread: 1.2, speed: 0.8, grav: 0.02, life: 120 });
            }
            // Bonus wird hochgezählt
            if (modeT > 60 && bonus > 0 && modeT % 2 === 0) {
                bonus -= 100;
                score += 100;
            }
            if (modeT > 60 && bonus <= 0 && modeT > 170) {
                round++;
                resetRound();
            }
        }

        // ---------- Zeichnen ----------
        function drawLadders() {
            ctx.fillStyle = '#3cbcfc';
            for (const l of ladders) {
                const top = Math.round(gy(l.t, l.x)), bottom = Math.round(gy(l.b, l.x));
                ctx.fillRect(l.x - 4, top, 1, bottom - top);
                ctx.fillRect(l.x + 3, top, 1, bottom - top);
                for (let y = top + 3; y < bottom; y += 4) ctx.fillRect(l.x - 4, y, 8, 1);
            }
        }

        function drawGirders() {
            girders.forEach((g, i) => {
                for (let x = g.x0; x < g.x1; x += 8) {
                    const y = Math.round(gy(i, x + 4));
                    ctx.fillStyle = '#d82800';
                    ctx.fillRect(x, y, 8, 7);
                    ctx.fillStyle = '#fc7460';
                    ctx.fillRect(x, y, 8, 1);
                    ctx.fillStyle = '#000';
                    for (let k = 0; k < 5; k++) {
                        ctx.fillRect(x + 1 + k, y + 1 + k, 1, 1);
                        ctx.fillRect(x + 6 - k, y + 1 + k, 1, 1);
                    }
                }
            });
        }

        function drawDrum() {
            ctx.fillStyle = '#0058f8';
            ctx.fillRect(4, 213, 16, 15);
            ctx.fillStyle = '#3cbcfc';
            ctx.fillRect(3, 212, 18, 2);
            ctx.fillRect(3, 226, 18, 2);
            ctx.fillRect(4, 218, 16, 1);
            ctx.fillStyle = '#fcfcfc';
            ctx.fillRect(7, 221, 2, 3);
            ctx.fillRect(10, 221, 1, 3);
            ctx.fillRect(13, 221, 1, 3);
            ctx.fillRect(13, 223, 3, 1);
        }

        function drawBarrelAt(cx, bottom, frame, front, squash = 0) {
            const h = 10 - (squash > 4 ? 2 : 0);
            const w = 10 + (squash > 4 ? 2 : 0);
            const x = Math.round(cx - w / 2), y = Math.round(bottom - h);
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(x + 1, y, w - 2, h);
            ctx.fillRect(x, y + 1, w, h - 2);
            ctx.fillStyle = '#7c2c00';
            if (front) {
                ctx.fillRect(x + 1, y + 2, w - 2, 1);
                ctx.fillRect(x + 1, y + h - 3, w - 2, 1);
            } else {
                const f = Math.floor(frame) % 4;
                ctx.fillRect(x + 1 + (f * 2) % 8, y + 1, 1, h - 2);
                ctx.fillRect(x + 1 + (f * 2 + 4) % 8, y + 1, 1, h - 2);
            }
            ctx.fillStyle = '#fca044';
            ctx.fillRect(x + 2, y + 1, 2, 1);
        }

        function drawApe() {
            const x = 18;
            const bob = ape.pose === 'idle' ? Math.round(Math.sin(tick * 0.08)) : 0;
            const top = Math.round(gy(5, 34)) - 28 + bob;
            const r = (rx, ry, w, h, c) => {
                ctx.fillStyle = c;
                ctx.fillRect(x + rx, top + ry, w, h);
            };
            const BR = '#a84c00', TN = '#fca044';
            const f = Math.floor(ape.poseT / 8) % 2;

            r(6, 20, 7, 8 - bob, BR);
            r(19, 20, 7, 8 - bob, BR);
            r(5, 26 - bob, 8, 2, TN);
            r(19, 26 - bob, 8, 2, TN);
            r(6, 9, 20, 13, BR);
            r(10, 11, 12, 9, TN);
            r(10, 0, 12, 10, BR);
            r(12, 3, 8, 6, TN);
            r(13, 4, 2, 2, '#fcfcfc');
            r(17, 4, 2, 2, '#fcfcfc');
            r(14, 5, 1, 1, '#000');
            r(18, 5, 1, 1, '#000');

            if (ape.pose === 'grab') {
                r(2, -6, 6, 17, BR);
                r(24, -6, 6, 17, BR);
                r(13, 7, 6, 1, '#000');
                drawBarrelAt(x + 16, top - 1, 0, true);
            } else if (ape.pose === 'throw') {
                r(1, 10, 6, 13, BR);
                r(1, 22, 6, 3, TN);
                r(24, 10, 12, 5, BR);
                r(34, 10, 3, 5, TN);
                r(13, 7, 6, 1, '#000');
            } else if (ape.pose === 'pound') {
                r(3, f ? 10 : 13, 9, 5, BR);
                r(20, f ? 13 : 10, 9, 5, BR);
                r(13, 7, 6, 2, '#d82800');
            } else {
                r(1, 10, 6, 13, BR);
                r(25, 10, 6, 13, BR);
                r(1, 22, 6, 3, TN);
                r(25, 22, 6, 3, TN);
                r(13, 7, 6, 1, '#000');
            }
        }

        function drawPrincess() {
            const img = Math.floor(tick / 20) % 2 ? princessWave : princess;
            ctx.drawImage(img, 98, 10);
            if (mode === 'play' && Math.floor(tick / 30) % 2) {
                ctx.font = '8px ' + FONT;
                ctx.fillStyle = '#f878f8';
                ctx.fillText('HILFE!', 114, 12);
            }
            if (mode === 'win') {
                const t = Math.min(1, modeT / 30);
                const s = easeOutBack(t) * 2;
                const y = 2 + Math.sin(tick * 0.1) * 1.5;
                ctx.save();
                ctx.translate(Math.round((98 + player.x) / 2 + 3), Math.round(y));
                ctx.scale(s, s);
                ctx.drawImage(heart, -3.5, 0);
                ctx.restore();
            }
        }

        function drawPlayer() {
            const p = player;
            if (!p) return;

            if (mode === 'dying') {
                // Drehung in 90°-Schritten wie auf dem NES, danach kreisende Sterne
                const steps = modeT < 30 ? 0 : Math.min(9, Math.floor((modeT - 30) / 6));
                ctx.save();
                ctx.translate(Math.round(p.x), Math.round(p.y - 8));
                ctx.rotate(steps * Math.PI / 2);
                ctx.drawImage(heroStand, -6, -8);
                ctx.restore();
                if (modeT > 85) {
                    ctx.fillStyle = '#f8b800';
                    for (let i = 0; i < 3; i++) {
                        const a = tick * 0.12 + i * Math.PI * 2 / 3;
                        ctx.fillRect(Math.round(p.x + Math.cos(a) * 8), Math.round(p.y - 12 + Math.sin(a) * 3), 2, 2);
                    }
                }
                return;
            }

            let img = heroStand, flip = p.face < 0;
            if (p.state === 'air') img = heroJump;
            else if (p.state === 'ladder') {
                img = heroClimb;
                flip = Math.floor(p.y / 4) % 2 === 0;
            } else if (p.vx) img = Math.floor(p.anim) % 2 ? heroWalk : heroStand;

            ctx.save();
            ctx.translate(Math.round(p.x), Math.round(p.y));
            ctx.scale((flip ? -1 : 1) * p.sx, p.sy);
            ctx.drawImage(img, -6, -16);
            ctx.restore();
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawPopups() {
            ctx.font = '8px ' + FONT;
            ctx.textAlign = 'center';
            for (const p of popups) {
                ctx.globalAlpha = 1 - p.t / 45;
                ctx.fillStyle = '#fcfcfc';
                ctx.fillText(p.text, Math.round(p.x), Math.round(p.y - easeOut(p.t / 45) * 14));
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
        }

        function drawHUD() {
            ctx.font = '8px ' + FONT;
            ctx.textBaseline = 'top';
            ctx.fillStyle = '#d82800';
            ctx.fillText('1UP', 4, 3);
            ctx.fillStyle = '#fcfcfc';
            ctx.fillText(String(score).padStart(6, '0'), 32, 3);
            ctx.fillStyle = '#3cbcfc';
            ctx.fillText('L=' + round, 4, 14);
            ctx.fillStyle = '#f8b800';
            for (let i = 0; i < lives - 1 && mode !== 'title' && mode !== 'over'; i++) ctx.fillRect(60 + i * 7, 15, 5, 5);

            ctx.strokeStyle = '#0058f8';
            ctx.strokeRect(196.5, 2.5, 55, 21);
            ctx.fillStyle = '#3cbcfc';
            ctx.fillText('BONUS', 204, 5);
            ctx.fillStyle = bonus <= 1000 && Math.floor(tick / 15) % 2 ? '#d82800' : '#fcfcfc';
            ctx.fillText(String(Math.max(0, bonus)).padStart(4, '0'), 208, 14);
        }

        function drawCenterText(text, y, size, color) {
            ctx.font = size + 'px ' + FONT;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#000';
            ctx.fillText(text, W / 2 + 1, y + 1);
            ctx.fillStyle = color;
            ctx.fillText(text, W / 2, y);
            ctx.textAlign = 'left';
        }

        function drawTitle() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, W, H);
            const title = 'FASS-ATTACKE';
            ctx.font = '16px ' + FONT;
            const colors = ['#d82800', '#e45c10', '#f8b800'];
            [...title].forEach((ch, i) => {
                const y = 70 + Math.sin(tick * 0.08 + i * 0.5) * 4;
                const x = W / 2 - title.length * 8 + i * 16;
                ctx.fillStyle = '#000';
                ctx.fillText(ch, x + 2, y + 2);
                ctx.fillStyle = colors[Math.floor(i + tick / 10) % 3];
                ctx.fillText(ch, x, y);
            });
            drawCenterText('KLETTERE ZUR PRINZESSIN', 110, 8, '#fcfcfc');
            drawCenterText('SPRING UEBER DIE FAESSER', 124, 8, '#fcfcfc');
            if (Math.floor(tick / 30) % 2) drawCenterText('ENTER / TIPPEN', 156, 8, '#f8b800');
            drawCenterText('REKORD ' + String(best).padStart(6, '0'), 186, 8, '#3cbcfc');
        }

        function drawOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, W, H);
            const s = easeOutBack(Math.min(1, modeT / 40));
            ctx.save();
            ctx.translate(W / 2, 90);
            ctx.scale(s, s);
            ctx.translate(-W / 2, -90);
            drawCenterText('GAME OVER', 84, 16, '#d82800');
            ctx.restore();
            drawCenterText('PUNKTE ' + String(score).padStart(6, '0'), 124, 8, '#fcfcfc');
            drawCenterText('REKORD ' + String(best).padStart(6, '0'), 140, 8, '#3cbcfc');
            if (Math.floor(tick / 30) % 2) drawCenterText('ENTER = NOCHMAL', 172, 8, '#f8b800');
        }

        function drawIris() {
            const r = easeOut(iris.t / 40) * 360;
            const cx = player ? player.x : W / 2, cy = player ? player.y - 8 : H / 2;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.rect(0, 0, W, H);
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill('evenodd');
        }

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);
            ctx.textBaseline = 'top';
            if (shake) ctx.translate(Math.round((Math.random() * 2 - 1) * shake), Math.round((Math.random() * 2 - 1) * shake));

            drawLadders();
            drawGirders();
            drawDrum();
            drawPrincess();
            drawApe();
            for (const b of barrels) drawBarrelAt(b.x, b.y, b.roll, b.state === 'ladder', b.squash);
            drawPlayer();
            drawParticles();
            drawPopups();

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            drawHUD();
            if (mode === 'title') drawTitle();
            if (mode === 'over') drawOver();
            if (iris) drawIris();
            if (flash) {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + flash / 8 + ')';
                ctx.fillRect(0, 0, W, H);
            }
        }

        // ---------- Spielschleife mit festem Zeitschritt ----------
        let last = performance.now(), acc = 0;
        function loop(now) {
            acc += Math.min(100, now - last);
            last = now;
            while (acc >= 1000 / 60) {
                update();
                acc -= 1000 / 60;
            }
            render();
            requestAnimationFrame(loop);
        }

        // ---------- Eingabe ----------
        const KEYS = {
            ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
            ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down'
        };
        document.addEventListener('keydown', e => {
            if (KEYS[e.code]) input[KEYS[e.code]] = true;
            if (!e.repeat && ['Space', 'KeyZ', 'KeyX'].includes(e.code)) input.jump = true;
            if (!e.repeat && ['Enter', 'Space'].includes(e.code)) input.start = true;
            if (KEYS[e.code] || e.code === 'Space') e.preventDefault();
        });
        document.addEventListener('keyup', e => {
            if (KEYS[e.code]) input[KEYS[e.code]] = false;
        });
        cv.addEventListener('pointerdown', () => { input.start = true; });
        document.querySelectorAll('.pad button').forEach(btn => {
            const k = btn.dataset.k;
            const release = () => { if (k !== 'jump') input[k] = false; };
            btn.addEventListener('pointerdown', e => {
                e.preventDefault();
                if (k === 'jump') {
                    input.jump = true;
                    input.start = true;
                } else {
                    input[k] = true;
                }
            });
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        });

        document.fonts.load('8px "Press Start 2P"').finally(() => requestAnimationFrame(loop));
    </script>
</body>

</html>
